<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1067" viewBox="0 0 1600 1067" role="img" aria-labelledby="title-zh desc-zh">
<title id="title-zh">NumPilot 架构</title>
<desc id="desc-zh">模型负责提出候选；确定性证据决定候选能否采用。</desc>
<defs>
  <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#5b4ee8"/><stop offset="1" stop-color="#008aa3"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow-current" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
  </marker>
  <marker id="arrow-planned" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#a855f7"/>
  </marker>
  <style>
    text { font-family: Inter, "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", Arial, sans-serif; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
  </style>
</defs>
<rect width="1600" height="1067" fill="#f8fafc"/>
<rect x="0" y="0" width="1600" height="12" fill="url(#header)"/>
<text x="52" y="58" text-anchor="start" font-size="34" font-weight="800" fill="#0f172a"><tspan x="52" dy="0">NumPilot 架构</tspan></text>
<text x="52" y="86" text-anchor="start" font-size="18" font-weight="500" fill="#64748b"><tspan x="52" dy="0">以证据门禁驱动 NumPy → Ascend NPU 迁移</tspan></text>
<rect x="930" y="42" width="180" height="31" rx="15.5" fill="#059669" fill-opacity="0.12"/><text x="1020" y="63" text-anchor="middle" font-size="13" font-weight="750" fill="#059669"><tspan x="1020" dy="0">实线 · 已实现</tspan></text>
<rect x="1120" y="42" width="180" height="31" rx="15.5" fill="#9333ea" fill-opacity="0.12"/><text x="1210" y="63" text-anchor="middle" font-size="13" font-weight="750" fill="#9333ea"><tspan x="1210" dy="0">虚线 · 规划中</tspan></text>
<rect x="1310" y="42" width="240" height="31" rx="15.5" fill="#2563eb" fill-opacity="0.12"/><text x="1430" y="63" text-anchor="middle" font-size="11" font-weight="750" fill="#2563eb"><tspan x="1430" dy="0">描边 · 可选 / 依赖环境</tspan></text>
<g filter="url(#shadow)">
<rect x="50" y="112" width="1500" height="92" rx="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="76" y="150" text-anchor="start" font-size="22" font-weight="750" fill="#1d4ed8"><tspan x="76" dy="0">可选协作控制面</tspan></text>
<text x="355" y="145" text-anchor="start" font-size="16" font-weight="500" fill="#334155"><tspan x="355" dy="0">CodeArts 角色或其他外部编排器可协调任务与审批。</tspan><tspan x="355" dy="26">能力事实仍由本地确定性证据给出；该控制面不是运行时依赖。</tspan></text>
</g>
<text x="50" y="242" text-anchor="start" font-size="17" font-weight="800" fill="#047857"><tspan x="50" dy="0">当前 ORDINARY 普通脚本主链 — 已实现</tspan></text>
<g filter="url(#shadow)">
<rect x="50" y="260" width="170" height="250" rx="18" fill="#ffffff" stroke="#0ea5e9" stroke-width="3"/><rect x="50" y="260" width="170" height="10" rx="5" fill="#0ea5e9"/><text x="68" y="303" text-anchor="start" font-size="21" font-weight="750" fill="#0f172a"><tspan x="68" dy="0">NumPy 脚本</tspan></text><text x="68" y="337" text-anchor="start" font-size="16" font-weight="500" fill="#475569"><tspan x="68" dy="0">import numpy as np</tspan><tspan x="68" dy="26">无需入口约定</tspan><tspan x="68" dy="26">仅运行可信源码</tspan></text>
<rect x="250" y="260" width="220" height="250" rx="18" fill="#ffffff" stroke="#14b8a6" stroke-width="3"/><rect x="250" y="260" width="220" height="10" rx="5" fill="#14b8a6"/><text x="268" y="303" text-anchor="start" font-size="21" font-weight="750" fill="#0f172a"><tspan x="268" dy="0">analyze</tspan></text><text x="268" y="337" text-anchor="start" font-size="15" font-weight="500" fill="#475569"><tspan x="268" dy="0">全文件 AST</tspan><tspan x="268" dy="26">有界数据流</tspan><tspan x="268" dy="26">调用点 + 签名</tspan><tspan x="268" dy="26">运行时 / 哈希身份</tspan><tspan x="268" dy="26">不执行源码、不调用模型</tspan></text>
<rect x="500" y="260" width="290" height="250" rx="18" fill="#ffffff" stroke="#22c55e" stroke-width="3"/><rect x="500" y="260" width="290" height="10" rx="5" fill="#22c55e"/><text x="518" y="303" text-anchor="start" font-size="21" font-weight="750" fill="#0f172a"><tspan x="518" dy="0">五态能力判定</tspan></text><text x="518" y="337" text-anchor="start" font-size="15" font-weight="500" fill="#475569"></text>
<rect x="820" y="260" width="210" height="250" rx="18" fill="#ffffff" stroke="#8b5cf6" stroke-width="3"/><rect x="820" y="260" width="210" height="10" rx="5" fill="#8b5cf6"/><text x="838" y="303" text-anchor="start" font-size="21" font-weight="750" fill="#0f172a"><tspan x="838" dy="0">用户配置模型</tspan></text><text x="838" y="337" text-anchor="start" font-size="15" font-weight="500" fill="#475569"><tspan x="838" dy="0">OpenAI-compatible</tspan><tspan x="838" dy="26">仅处理已授权路径</tspan><tspan x="838" dy="26">响应与源码绑定</tspan><tspan x="838" dy="26">不负责猜测能力</tspan></text>
<rect x="1060" y="260" width="220" height="250" rx="18" fill="#ffffff" stroke="#f59e0b" stroke-width="3"/><rect x="1060" y="260" width="220" height="10" rx="5" fill="#f59e0b"/><text x="1078" y="303" text-anchor="start" font-size="21" font-weight="750" fill="#0f172a"><tspan x="1078" dy="0">确定性门禁</tspan></text><text x="1078" y="337" text-anchor="start" font-size="14" font-weight="500" fill="#475569"><tspan x="1078" dy="0">模型回执 + 身份</tspan><tspan x="1078" dy="26">精确 AST + 产物哈希</tspan><tspan x="1078" dy="26">verify-script：数值</tspan><tspan x="1078" dy="26">benchmark-script：范围绑定</tspan><tspan x="1078" dy="26">可选 strict-NPU 性能门</tspan></text>
<rect x="1310" y="260" width="240" height="250" rx="18" fill="#ffffff" stroke="#ec4899" stroke-width="3"/><rect x="1310" y="260" width="240" height="10" rx="5" fill="#ec4899"/><text x="1328" y="303" text-anchor="start" font-size="21" font-weight="750" fill="#0f172a"><tspan x="1328" dy="0">证据回执</tspan></text><text x="1328" y="337" text-anchor="start" font-size="14" font-weight="500" fill="#475569"><tspan x="1328" dy="0">不可覆盖的运行产物</tspan><tspan x="1328" dy="26">源码 / 运行时哈希</tspan><tspan x="1328" dy="26">如实记录状态与范围</tspan><tspan x="1328" dy="26">不保存凭据或原始</tspan><tspan x="1328" dy="26">模型响应正文</tspan></text>
</g>
