<rect x="518" y="330" width="96" height="31" rx="15.5" fill="#059669" fill-opacity="0.12"/><text x="566" y="351" text-anchor="middle" font-size="12" font-weight="750" fill="#059669"><tspan x="566" dy="0">DIRECT</tspan></text>
<rect x="624" y="330" width="148" height="31" rx="15.5" fill="#d97706" fill-opacity="0.12"/><text x="698" y="351" text-anchor="middle" font-size="9" font-weight="750" fill="#d97706"><tspan x="698" dy="0">FALLBACK_CONSENT</tspan></text>
<rect x="518" y="374" width="122" height="31" rx="15.5" fill="#be123c" fill-opacity="0.12"/><text x="579" y="395" text-anchor="middle" font-size="10" font-weight="750" fill="#be123c"><tspan x="579" dy="0">GAP_REQUIRED</tspan></text>
<rect x="650" y="374" width="122" height="31" rx="15.5" fill="#64748b" fill-opacity="0.12"/><text x="711" y="395" text-anchor="middle" font-size="11" font-weight="750" fill="#64748b"><tspan x="711" dy="0">BLOCKED</tspan></text>
<rect x="518" y="418" width="254" height="31" rx="15.5" fill="#2563eb" fill-opacity="0.12"/><text x="645" y="439" text-anchor="middle" font-size="10" font-weight="750" fill="#2563eb"><tspan x="645" dy="0">CAPABILITY_AUDIT_REQUIRED</tspan></text>
<text x="645" y="478" text-anchor="middle" font-size="12" font-weight="600" fill="#64748b"><tspan x="645" dy="0">仅 DIRECT / 已接受回退继续 →</tspan></text>
<text x="50" y="553" text-anchor="start" font-size="16" font-weight="800" fill="#9f1239"><tspan x="50" dy="0">官方优先 GAP 解析 — 已实现，且不同路由有各自边界</tspan></text>
<text x="50" y="578" text-anchor="start" font-size="13" font-weight="500" fill="#64748b"><tspan x="50" dy="0">仅由 GAP_REQUIRED 进入；不存在统一自动通向适配器的链。</tspan></text>
<path d="M579 510 L579 596" fill="none" stroke="#be123c" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-current)"/>
<g filter="url(#shadow)">
<rect x="50" y="600" width="450" height="170" rx="18" fill="#ffffff" stroke="#dc2626" stroke-width="3"/><rect x="50" y="600" width="450" height="10" rx="5" fill="#dc2626"/><text x="68" y="643" text-anchor="start" font-size="18" font-weight="750" fill="#0f172a"><tspan x="68" dy="0">1 · 已安装 ACLNN</tspan></text><text x="68" y="677" text-anchor="start" font-size="13" font-weight="500" fill="#475569"><tspan x="68" dy="0">通用 official_binary</tspan><tspan x="68" dy="26">→ CANDIDATE_READY</tspan><tspan x="68" dy="26">REVIEWED_MATMUL_ONLY</tspan><tspan x="68" dy="26">→ ADAPTER_CANDIDATE</tspan></text>
<rect x="550" y="600" width="450" height="170" rx="18" fill="#ffffff" stroke="#dc2626" stroke-width="3"/><rect x="550" y="600" width="450" height="10" rx="5" fill="#dc2626"/><text x="568" y="643" text-anchor="start" font-size="18" font-weight="750" fill="#0f172a"><tspan x="568" dy="0">2 · 固定本地 ops-nn</tspan></text><text x="568" y="677" text-anchor="start" font-size="13" font-weight="500" fill="#475569"><tspan x="568" dy="0">ACLNN 明确无匹配后</tspan><tspan x="568" dy="26">SOURCE_EVIDENCE_ONLY</tspan><tspan x="568" dy="26">尚未接线物化</tspan></text>
<rect x="1050" y="600" width="500" height="170" rx="18" fill="#ffffff" stroke="#dc2626" stroke-width="3"/><rect x="1050" y="600" width="500" height="10" rx="5" fill="#dc2626"/><text x="1068" y="643" text-anchor="start" font-size="18" font-weight="750" fill="#0f172a"><tspan x="1068" dy="0">3 · CANNBot Skills + 配置模型</tspan></text><text x="1068" y="677" text-anchor="start" font-size="13" font-weight="500" fill="#475569"><tspan x="1068" dy="0">两层明确无匹配后</tspan><tspan x="1068" dy="26">UNVERIFIED_OPERATOR_DRAFT</tspan><tspan x="1068" dy="26">不会自行成为适配器</tspan></text>
</g>
