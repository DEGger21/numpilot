<text x="355" y="145" text-anchor="start" font-size="16" font-weight="500" fill="#334155"><tspan x="355" dy="0">CodeArts roles or another external orchestrator may coordinate tasks and approvals.</tspan><tspan x="355" dy="26">Capability facts still come from local deterministic evidence; this plane is not a runtime dependency.</tspan></text>
