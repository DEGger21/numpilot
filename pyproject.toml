[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "numpilot"
version = "0.1.0"
description = "面向科学智能的昇腾 NPU 代码自动迁移智能体(最简 demo)"
requires-python = ">=3.9"
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["numpilot*"]
