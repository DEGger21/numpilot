[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "numpilot"
version = "0.1.0"
description = "面向科学智能的昇腾 NPU 代码自动迁移智能体(最简 demo)"
requires-python = ">=3.9"
dependencies = ["numpy", "rich>=13"]

[project.optional-dependencies]
dev = ["pytest"]
# 真机可选:asnumpy(NPU 后端)、threadpoolctl(备用 BLAS 限核)
npu = ["threadpoolctl"]

[tool.setuptools.packages.find]
include = ["numpilot*"]
