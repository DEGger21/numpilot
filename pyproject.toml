[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "numpilot"
version = "0.3.0a1.dev0"
description = "面向科学计算的 NumPy 到 Ascend NPU 可审计迁移工具"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "loguru>=0.7", "rich>=13"]
keywords = ["numpy", "ascend", "npu", "migration", "scientific-computing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering",
]

[project.urls]
Repository = "https://gitcode.com/li-xingHIT/numpilot"
Documentation = "https://gitcode.com/li-xingHIT/numpilot"

[project.scripts]
numpilot = "numpilot.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1"]
demo = ["numpy==1.26.4", "loguru==0.7.3"]
bootstrap = [
  "numpy>=2.0",
  "build>=1",
  "cmake>=3.26",
  "scikit-build-core>=1.0.0",
  "pybind11>=3.0.0",
  "setuptools-scm==9.2.2",
  "towncrier>=24",
]
# 真机可选:asnumpy(NPU 后端)、threadpoolctl(备用 BLAS 限核)
npu = ["threadpoolctl"]

[tool.setuptools.packages.find]
include = ["numpilot*"]

[tool.setuptools.data-files]
"share/numpilot/codearts" = [
  ".codeartsdoer/skills/ProjectSkillStatus.txt",
]
"share/numpilot/codearts/agents" = [
  ".codeartsdoer/agents/numpilot-analyzer.md",
  ".codeartsdoer/agents/numpilot-evidence-auditor.md",
  ".codeartsdoer/agents/numpilot-operator-engineer.md",
  ".codeartsdoer/agents/numpilot-orchestrator.md",
]
"share/numpilot/skills/numpilot-migration-gate" = [
  ".codeartsdoer/skills/numpilot-migration-gate/SKILL.md",
]
"share/numpilot/skills/asnumpy-custom-op-integration" = [
  ".codeartsdoer/skills/asnumpy-custom-op-integration/SKILL.md",
]
"share/numpilot/skills/asnumpy-custom-op-integration/agents" = [
  ".codeartsdoer/skills/asnumpy-custom-op-integration/agents/openai.yaml",
]
"share/numpilot/skills/asnumpy-custom-op-integration/references" = [
  ".codeartsdoer/skills/asnumpy-custom-op-integration/references/legacy-case-lessons.md",
  ".codeartsdoer/skills/asnumpy-custom-op-integration/references/manifest-workflow.md",
  ".codeartsdoer/skills/asnumpy-custom-op-integration/references/official-aclnn-existing-module.md",
  ".codeartsdoer/skills/asnumpy-custom-op-integration/references/qualification-and-debug.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
